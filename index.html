    el(&#x27;schematic-bore&#x27;).textContent = &#x27;Piston Ø&#x27;+diameter+&#x27; mm · asumsi&#x27;;

  }

  function announce(status) {

  }
  function notify(message) { el(&#x27;notice&#x27;).textContent = message; }

  function render() {
    el(&#x27;mass&#x27;).textContent = fmt(mass);
    const controlError = mass-target;
    el(&#x27;force&#x27;).textContent = fmt(mass*g,2) + &#x27; N&#x27; + (mode===&#x27;running&#x27;?&#x27; · error kendali &#x27;+(controlError&gt;=.0005?&#x27;+&#x27;:&#x27;&#x27;)+fmt(controlError)+&#x27; kg&#x27;:&#x27;&#x27;);

    el(&#x27;piston&#x27;).setAttribute(&#x27;y&#x27;,108+travel);
    el(&#x27;inner-rod&#x27;).setAttribute(&#x27;y&#x27;,118+travel);
    el(&#x27;inner-rod&#x27;).setAttribute(&#x27;height&#x27;,50-travel);
    el(&#x27;pressure-chamber&#x27;).setAttribute(&#x27;height&#x27;,9+travel);
    el(&#x27;pressure-chamber&#x27;).style.opacity = String(clamp(pressure/6,0,.5));
    el(&#x27;force-arrow&#x27;).setAttribute(&#x27;opacity&#x27;,mass&gt;.1 ? 1 : 0);
    const angle = -140 + clamp(pressure/6,0,1)*280;

    el(&#x27;gauge-needle&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M441 135L&#x27;+(441+8*Math.cos(rad)).toFixed(2)+&#x27; &#x27;+(135+8*Math.sin(rad)).toFixed(2));
    let status = emergency ? (pressure&gt;.01 ? &#x27;Darurat · tekanan dilepas&#x27; : &#x27;Darurat · beban sudah dilepas&#x27;) : mode===&#x27;releasing&#x27; ? &#x27;Melepas beban…&#x27; : mode===&#x27;running&#x27; ? (stable() ? &#x27;Stabil · siap dicatat&#x27; : &#x27;Menyesuaikan gaya…&#x27;) : &#x27;Siap · beban dilepas&#x27;;
    if (auto) status = &#x27;Uji otomatis &#x27;+Math.min(auto.index+1,auto.targets.length)+&#x27;/&#x27;+auto.targets.length+&#x27; · &#x27;+(auto.phase===&#x27;release&#x27;?&#x27;melepas beban&#x27;:stable()?&#x27;stabil&#x27;:&#x27;menyesuaikan&#x27;);

    el(&#x27;start&#x27;).disabled = !!auto || mode===&#x27;releasing&#x27; || (emergency &amp;&amp; pressure&gt;.01);

    if(mode===&#x27;running&#x27;) el(&#x27;start&#x27;).disabled = true;

    el(&#x27;results-auto&#x27;).disabled = !!auto || emergency || mode===&#x27;releasing&#x27;;
    [&#x27;target&#x27;,&#x27;target-number&#x27;,&#x27;diameter&#x27;,&#x27;scale-gain&#x27;,&#x27;scale-offset&#x27;,&#x27;cycles&#x27;].forEach(id=&gt;{el(id).disabled=!!auto || ([&#x27;diameter&#x27;,&#x27;scale-gain&#x27;,&#x27;scale-offset&#x27;].includes(id) &amp;&amp; mode!==&#x27;idle&#x27;);});
    root.querySelectorAll(&#x27;[data-target]&#x27;).forEach(b=&gt;{b.disabled=!!auto;});
    drawChart();
  }

  function drawChart() {
    const svg = el(&#x27;response&#x27;);
    if (!svg.getBoundingClientRect().width) return;
    const w = Math.max(250,svg.getBoundingClientRect().width), h = 148;
    const left = 43, right = 10, top = 17, bottom = 31;
    const xmax = Math.max(10,t), xmin = Math.max(0,xmax-10);
    const maxForce = Math.max(196.2,...history.map(p=&gt;p.f),...history.map(p=&gt;p.target));
    const ymax = Math.ceil((maxForce*1.04)/50)*50;
    const x = n =&gt; left + (n-xmin)/(xmax-xmin)*(w-left-right);
    const y = n =&gt; top + (1-n/ymax)*(h-top-bottom);
    const points = history.filter(p=&gt;p.t&gt;=xmin);
    if(points.length===1) points.push({...points[0],t:xmax});
    const line = key =&gt; points.map((p,i)=&gt;(i?&#x27;L&#x27;:&#x27;M&#x27;)+x(p.t).toFixed(1)+&#x27; &#x27;+y(p[key]).toFixed(1)).join(&#x27; &#x27;);
    let grid=&#x27;&#x27;;
    [0,ymax/2,ymax].forEach(v=&gt;{grid+=&#x27;&lt;path d=&quot;M&#x27;+left+&#x27; &#x27;+y(v)+&#x27;H&#x27;+(w-right)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--pls-line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;&#x27;+(left-8)+&#x27;&quot; y=&quot;&#x27;+(y(v)+4)+&#x27;&quot; text-anchor=&quot;end&quot; fill=&quot;var(--pls-muted)&quot; font-size=&quot;11&quot;&gt;&#x27;+fmt(v,0)+&#x27;&lt;/text&gt;&#x27;;});
    [0,.5,1].forEach((r,i)=&gt;{const val=xmin+r*(xmax-xmin);grid+=&#x27;&lt;text x=&quot;&#x27;+x(val)+&#x27;&quot; y=&quot;&#x27;+(h-14)+&#x27;&quot; text-anchor=&quot;&#x27;+(i===0?&#x27;start&#x27;:i===2?&#x27;end&#x27;:&#x27;middle&#x27;)+&#x27;&quot; fill=&quot;var(--pls-muted)&quot; font-size=&quot;11&quot;&gt;&#x27;+fmt(val,0)+&#x27; s&lt;/text&gt;&#x27;;});
    svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+w+&#x27; &#x27;+h);
    svg.innerHTML=&#x27;&lt;title&gt;Gaya load cell dan target&lt;/title&gt;&lt;desc&gt;Waktu &#x27;+fmt(xmin,1)+&#x27; sampai &#x27;+fmt(xmax,1)+&#x27; detik. Gaya sekarang &#x27;+fmt(mass*g,2)+&#x27; newton.&lt;/desc&gt;&lt;text x=&quot;0&quot; y=&quot;11&quot; fill=&quot;var(--pls-muted)&quot; font-size=&quot;11&quot;&gt;Gaya (N)&lt;/text&gt;&#x27;+grid+&#x27;&lt;path d=&quot;&#x27;+line(&#x27;target&#x27;)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--pls-muted)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;path d=&quot;&#x27;+line(&#x27;f&#x27;)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--pls-accent)&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;&#x27;;
  }

  function beginInterval() { if (!interval) interval = setInterval(tick,100); }
  function stopInterval() { if (interval) clearInterval(interval); interval=null; }
  function release(cancelAuto=true) {
    if (cancelAuto) { auto=null; notify(&#x27;Beban dilepas. Hasil yang telah dicatat tetap tersimpan.&#x27;); }
    mode=&#x27;releasing&#x27;; integral=0; stableTime=0; samples=[]; beginInterval(); render();
  }
  function beginLoad() {
    mode=&#x27;running&#x27;; integral=0; stableTime=0; samples=[]; loadCycle++; beginInterval(); render();
  }
  function setTarget(value) {
    target=Math.round(cleanNumber(value,target,0,20)*10)/10;

  }

  function tick() {
    t+=dt;

    else stableTime=0;

    samples=samples.filter(s=&gt;s.t&gt;t-1.05);

    history=history.filter(p=&gt;p.t&gt;=t-11);
    if(mode===&#x27;releasing&#x27; &amp;&amp; physical&lt;.001) {
      pressure=0;mass=0;scale=offset-tareOffset;mode=&#x27;idle&#x27;;samples=[];

    render();
  }

  function record() {
    if (!stable() || !samples.length) return;
    const avg = key =&gt; samples.reduce((n,s)=&gt;n+s[key],0)/samples.length;
    records.push({id:++recordId,target,reference:avg(&#x27;mass&#x27;),scale:avg(&#x27;scale&#x27;),pressure:avg(&#x27;pressure&#x27;),time:t,loadCycle,diameter,gain,offset,tareOffset,configuration:[diameter,gain,offset,tareOffset].join(&#x27;/&#x27;)});
    records=records.slice(-40);

  }
  function updateResults() {
    el(&#x27;count&#x27;).textContent=records.length;
    el(&#x27;summary-n&#x27;).textContent=records.length;
    if(!records.length) { el(&#x27;summary-error&#x27;).textContent=&#x27;—&#x27;;el(&#x27;summary-repeat&#x27;).textContent=&#x27;—&#x27;;return; }
    let maxErr=0;
    el(&#x27;result-rows&#x27;).innerHTML=records.map((r,i)=&gt;{
      const diff=r.scale-r.reference, pct=Math.abs(r.reference)&gt;.001?diff/r.reference*100:NaN;
      if(Number.isFinite(pct)) maxErr=Math.max(maxErr,Math.abs(pct));
      return &#x27;&lt;tr data-tooltip=&quot;Diameter &#x27;+fmt(r.diameter||32,0)+&#x27; mm; penyimpangan &#x27;+fmt(r.gain??.2,2)+&#x27;%; offset &#x27;+fmt(r.offset||0)+&#x27; kg; siklus pembebanan &#x27;+r.loadCycle+&#x27;&quot;&gt;&lt;td&gt;&#x27;+r.id+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r.target,1)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r.reference)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r.scale)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(diff&gt;=.0005?&#x27;+&#x27;:&#x27;&#x27;)+fmt(diff)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+(Number.isFinite(pct)?(pct&gt;=.0005?&#x27;+&#x27;:&#x27;&#x27;)+fmt(pct,3):&#x27;—&#x27;)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    }).join(&#x27;&#x27;);
    el(&#x27;summary-error&#x27;).textContent=fmt(maxErr,3)+&#x27; %&#x27;;
    const groups=new Map();
    records.forEach(r=&gt;{const key=r.target+&#x27;/&#x27;+(r.configuration||&#x27;32/0.2/0/0&#x27;);if(!groups.has(key))groups.set(key,new Map());groups.get(key).set(r.loadCycle,r);});
    let repeat=null;
    groups.forEach(group=&gt;{if(group.size&lt;2)return;const vals=[...group.values()].map(r=&gt;r.reference);const range=Math.max(...vals)-Math.min(...vals);repeat=repeat===null?range:Math.max(repeat,range);});
    el(&#x27;summary-repeat&#x27;).textContent=repeat===null?&#x27;—&#x27;:fmt(repeat,4)+&#x27; kg&#x27;;
    const configurations=new Map();
    records.forEach(r=&gt;{const key=r.configuration||&#x27;32/0.2/0/0&#x27;;if(!configurations.has(key))configurations.set(key,new Map());const points=configurations.get(key);if(!points.has(r.target))points.set(r.target,[]);points.get(r.target).push(r.reference);});
    let linearity=null;
    configurations.forEach(points=&gt;{if(points.size&lt;3)return;const xy=[...points].map(([x,ys])=&gt;({x,y:ys.reduce((a,b)=&gt;a+b,0)/ys.length}));const mx=xy.reduce((a,p)=&gt;a+p.x,0)/xy.length,my=xy.reduce((a,p)=&gt;a+p.y,0)/xy.length;const slope=xy.reduce((a,p)=&gt;a+(p.x-mx)*(p.y-my),0)/xy.reduce((a,p)=&gt;a+(p.x-mx)**2,0);const residual=Math.max(...xy.map(p=&gt;Math.abs(p.y-(my+slope*(p.x-mx)))));linearity=linearity===null?residual:Math.max(linearity,residual);});
    el(&#x27;summary-linearity&#x27;).textContent=linearity===null?&#x27;—&#x27;:fmt(linearity,4)+&#x27; kg&#x27;;
    el(&#x27;result-detail&#x27;).textContent=&#x27;Error timbangan = indikasi − acuan load cell. &#x27;+(repeat===null?&#x27;Rentang ulang memerlukan pembebanan ulang pada target yang sama.&#x27;:&#x27;Rentang ulang adalah selisih maksimum–minimum load cell per target, dari pembebanan yang berbeda.&#x27;)+&#x27; Linearitas adalah simpangan maksimum load cell dari garis regresi; minimal tiga target berbeda. Analisis hanya menggabungkan parameter model yang sama. Seluruh data merupakan simulasi.&#x27;;
  }
  function beginAuto() {
    if(emergency || auto)return;
    const targets=[];
    for(let i=0;i&lt;cycles;i++)targets.push(5,10,15,20);
    auto={targets,index:0,phase:&#x27;release&#x27;};
    showPane(&#x27;tool&#x27;);notify(&#x27;Uji otomatis: melepas dan memasang beban kembali pada setiap titik.&#x27;);
    release(false);
  }

  root.querySelectorAll(&#x27;.pls-tab&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;showPane(b.dataset.pane)));
  el(&#x27;target&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;setTarget(e.target.value));
  el(&#x27;target-number&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;setTarget(e.target.value));
  root.querySelectorAll(&#x27;[data-target]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;setTarget(b.dataset.target)));
  el(&#x27;start&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
    if(emergency){emergency=false;mode=&#x27;idle&#x27;;notify(&#x27;Darurat direset. Tekanan nol; alat siap untuk simulasi berikutnya.&#x27;);render();saveState();return;}
    if(target&lt;=0){notify(&#x27;Pilih target di atas 0 kg untuk memulai pembebanan.&#x27;);return;}
    notify(&#x27;Gaya diatur berdasarkan umpan balik load cell simulasi.&#x27;);beginLoad();saveState();
  });
  el(&#x27;release&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;release());
  el(&#x27;emergency&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{emergency=true;auto=null;release(false);notify(&#x27;Darurat simulasi aktif. Tekanan dibuang; tekan Reset darurat setelah beban nol.&#x27;);saveState();});
  el(&#x27;tare&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{if(mode!==&#x27;idle&#x27;||pressure&gt;=.01)return;tareOffset=offset;scale=0;notify(&#x27;Indikasi timbangan dinolkan pada kondisi tanpa beban.&#x27;);render();saveState();});
  el(&#x27;record&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;record());
  el(&#x27;auto&#x27;).addEventListener(&#x27;click&#x27;,beginAuto);
  el(&#x27;results-auto&#x27;).addEventListener(&#x27;click&#x27;,beginAuto);
  el(&#x27;cycles&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{cycles=Number(e.target.value);saveState();});
  el(&#x27;diameter&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{diameter=Number(e.target.value);syncInputs();render();saveState();});
  el(&#x27;scale-gain&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{gain=cleanNumber(e.target.value,gain,-2,2);syncInputs();render();saveState();});
  el(&#x27;scale-offset&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{offset=cleanNumber(e.target.value,offset,-.5,.5);scale=offset-tareOffset;syncInputs();render();saveState();});
  el(&#x27;back&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;showPane(&#x27;tool&#x27;));
  window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{const s=e.detail?.globals?.widgetState;if(!s || interval)return;restore(s);scale=offset-tareOffset;syncInputs();updateResults();showPane(pane,false);render();});
  window.addEventListener(&#x27;pagehide&#x27;,stopInterval);
  new ResizeObserver(()=&gt;{drawChart();const width=root.querySelector(&#x27;.pls-machine&#x27;).getBoundingClientRect().width;const factor=600/Math.max(260,width);root.querySelectorAll(&#x27;.pls-device-number text&#x27;).forEach(node=&gt;node.style.fontSize=(Math.min(26,12*factor))+&#x27;px&#x27;);root.querySelectorAll(&#x27;.pls-board-label&#x27;).forEach(node=&gt;node.style.fontSize=(Math.min(16,11*factor))+&#x27;px&#x27;);root.querySelectorAll(&#x27;.pls-small-digital&#x27;).forEach(node=&gt;{node.style.display=width&lt;430?&#x27;none&#x27;:&#x27;&#x27;;});}).observe(root);
  scale=offset-tareOffset;syncInputs();updateResults();showPane(pane,false);render();
  const design={annotations:true};
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=&gt;{root.querySelector(&#x27;.pls-parts&#x27;).hidden=!design.annotations;root.querySelector(&#x27;.pls-device-number&#x27;).style.display=design.annotations?&#x27;&#x27;:&#x27;none&#x27;;}});tweak.addToggle(design,&#x27;annotations&#x27;,{label:&#x27;Nama komponen&#x27;});}
})();
&lt;/script&gt;

      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
